<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="160" cy="160" r="156"/></clipPath>
    <style>
      .blink { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      .steam { animation: steam 2.5s ease-in-out infinite; opacity: .6; }
      @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 50% { opacity: .7; } 100% { transform: translateY(-8px); opacity: 0; } }
      .cursor { animation: cur 1s steps(1) infinite; }
      @keyframes cur { 50% { opacity: 0; } }
      .wave { animation: wave 2s ease-in-out infinite; transform-origin: 232px 250px; }
      @keyframes wave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(10deg); } }
    </style>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="320" height="320" fill="url(#bg)"/>
    <!-- renkli kutu (arkadaki) -->
    <g transform="translate(206 26) rotate(6)">
      <rect width="56" height="46" fill="#ef4444"/>
      <rect width="22" height="46" fill="#7dd3fc"/>
      <rect x="22" y="18" width="18" height="28" fill="#fcd34d"/>
      <rect x="-3" y="-8" width="62" height="10" fill="#facc15"/>
    </g>
    <circle cx="60" cy="70" r="6" fill="#fff" opacity=".7"/>
    <circle cx="45" cy="200" r="3" fill="#fff" opacity=".7"/>

    <!-- oyuncu koltuğu -->
    <path d="M66 320 L70 170 Q72 140 104 136 L216 136 Q248 140 250 170 L254 320 Z" fill="#1c1c22"/>
    <path d="M86 320 L90 175 Q92 158 104 154" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
    <path d="M234 320 L230 175 Q228 158 216 154" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>

    <!-- gövde / koyu gri tişört -->
    <path d="M88 330 Q92 232 160 226 Q228 232 232 330 Z" fill="#3a3d46"/>
    <path d="M138 228 Q160 246 182 228" fill="none" stroke="#2b2d34" stroke-width="5" stroke-linecap="round"/>

    <!-- el sallayan kol -->
    <g class="wave">
      <path d="M222 262 Q252 236 254 200" stroke="#3a3d46" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="254" cy="194" r="14" fill="#e9b894"/>
    </g>

    <!-- boyun -->
    <rect x="146" y="190" width="28" height="40" rx="8" fill="#d9a47f"/>

    <!-- kulaklar + yüz -->
    <ellipse cx="100" cy="142" rx="10" ry="14" fill="#e3ad88"/>
    <ellipse cx="220" cy="142" rx="10" ry="14" fill="#e3ad88"/>
    <path d="M100 120 Q100 70 160 70 Q220 70 220 120 L220 158 Q216 204 160 208 Q104 204 100 158 Z" fill="#edbd98"/>

    <!-- kısa sakal -->
    <path d="M101 146 Q106 176 124 186 Q136 192 146 190 Q160 196 174 190 Q184 192 196 186 Q214 176 219 146 L220 158 Q216 206 160 210 Q104 206 100 158 Z" fill="#2a1f1a" opacity=".85"/>
    <!-- bıyık -->
    <path d="M138 176 Q149 169 160 172 Q171 169 182 176 Q171 177 160 175 Q149 177 138 176 Z" fill="#1f1612" opacity=".9"/>
    <!-- dudak / hafif gülümseme -->
    <path d="M144 181 Q160 191 178 180 Q170 188 160 188 Q151 188 144 181 Z" fill="#c98580"/>

    <!-- kıvırcık saç -->
    <g fill="#2a1f1a">
      <path d="M100 132 Q94 84 146 70 Q206 60 222 106 L220 132 Q214 110 196 104 Q176 98 150 104 Q124 106 112 116 Q104 122 100 132 Z"/>
      <circle cx="108" cy="104" r="13"/>
      <circle cx="120" cy="84" r="16"/>
      <circle cx="142" cy="72" r="17"/>
      <circle cx="166" cy="68" r="18"/>
      <circle cx="190" cy="72" r="17"/>
      <circle cx="208" cy="88" r="15"/>
      <circle cx="216" cy="108" r="11"/>
      <circle cx="176" cy="92" r="10"/>
      <circle cx="152" cy="90" r="10"/>
    </g>
    <path d="M100 126 L100 150 L104 150 L104 128 Z M220 126 L220 150 L216 150 L216 128 Z" fill="#2a1f1a"/>
    <g fill="none" stroke="#4a3a31" stroke-width="2.5" stroke-linecap="round" opacity=".8">
      <path d="M134 70 q6 -6 12 0"/>
      <path d="M160 64 q6 -6 12 0"/>
      <path d="M186 70 q6 -6 12 0"/>
      <path d="M114 86 q5 -6 11 -1"/>
    </g>

    <!-- kaşlar -->
    <path d="M114 122 Q130 113 148 120" fill="none" stroke="#231915" stroke-width="6" stroke-linecap="round"/>
    <path d="M172 120 Q190 113 206 122" fill="none" stroke="#231915" stroke-width="6" stroke-linecap="round"/>

    <!-- gözler -->
    <g class="blink">
      <ellipse cx="132" cy="140" rx="6" ry="6.5" fill="#3f3a24"/>
      <circle cx="134" cy="138" r="1.8" fill="#fff"/>
    </g>
    <g class="blink">
      <ellipse cx="188" cy="140" rx="6" ry="6.5" fill="#3f3a24"/>
      <circle cx="190" cy="138" r="1.8" fill="#fff"/>
    </g>

    <!-- yuvarlak gri gözlük -->
    <g stroke="#4b4f58" stroke-width="4.5" fill="#ffffff" fill-opacity=".15">
      <rect x="110" y="122" width="44" height="38" rx="16"/>
      <rect x="166" y="122" width="44" height="38" rx="16"/>
    </g>
    <path d="M154 136 Q160 131 166 136" fill="none" stroke="#4b4f58" stroke-width="4"/>
    <path d="M110 132 L100 128 M210 132 L220 128" stroke="#4b4f58" stroke-width="4" stroke-linecap="round"/>
    <path d="M118 130 l8 -4 M174 130 l8 -4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>

    <!-- burun + yanak -->
    <path d="M158 146 Q152 162 160 164" fill="none" stroke="#c98e6a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="116" cy="164" rx="8" ry="5" fill="#f4a3a3" opacity=".45"/>
    <ellipse cx="204" cy="164" rx="8" ry="5" fill="#f4a3a3" opacity=".45"/>

    <!-- laptop -->
    <rect x="66" y="240" width="124" height="76" rx="8" fill="#1f2937"/>
    <rect x="74" y="248" width="108" height="60" rx="4" fill="#0f172a"/>
    <text x="82" y="266" font-family="monospace" font-size="11" fill="#a5b4fc">$ kubectl apply</text>
    <text x="82" y="282" font-family="monospace" font-size="11" fill="#86efac">✔ deployed</text>
    <rect class="cursor" x="82" y="290" width="7" height="11" fill="#f9fafb"/>

    <!-- kahve -->
    <g transform="translate(212 270)">
      <path class="steam" d="M8 -6 Q4 -14 10 -20" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:.8s" d="M18 -6 Q14 -14 20 -20" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="0" y="0" width="28" height="30" rx="5" fill="#f97316"/>
      <path d="M28 8 Q40 8 38 18 Q36 24 28 22" fill="none" stroke="#f97316" stroke-width="4"/>
    </g>
  </g>
</svg>
